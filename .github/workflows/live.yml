# Hourly live scan → static JSON + images → Cloudflare Pages ("smoke-or-vog").
#
# Server-side only: MODEL_API_KEY lives in Actions secrets and is passed only to the
# Python step. The site reads published JSON; no key ever reaches the browser or repo.
#
# GATE: the job runs only when the repository variable LIVE_ENABLED is "true".
#
# Secrets:   MODEL_API_KEY, CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID
# Variables: LIVE_ENABLED=true
name: live-scan

on:
  schedule:
    # Daylight in Hawaiʻi (HST = UTC-10): 06:07–18:07 HST → 16:07–04:07 UTC.
    - cron: "7 16-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore daylight / unchanged-frame checks"
        type: boolean
        default: false

permissions: {}    # granted per job below

concurrency:
  group: live-scan
  cancel-in-progress: false

jobs:
  scan:
    if: vars.LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # push the cost ledger + last live run to the live-data branch
      actions: write    # disable this workflow when the budget stop is hit
    outputs:
      status: ${{ steps.scan.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out live-data branch (cost ledger + last published live run)
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git clone --depth 1 --branch live-data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
          else
            mkdir live-data && cd live-data && git init -q -b live-data && \
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and publish
        id: scan
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          SMOKEVOG_COSTS_CSV: live-data/costs_live.csv     # CI ledger
          SMOKEVOG_EXTRA_LEDGERS: out/costs.csv            # development spend (committed)
          SMOKEVOG_STOP_AT_USD: "15"
          SMOKEVOG_TRACK: "1"                              # SAM 3.1 video motion tracking
          SMOKEVOG_WONDER: "1"                             # Muse Wonder second opinion (borderline only)
        run: |
          python -m src.live_publish --site-data site/data --persist live-data \
            ${{ inputs.force && '--force' || '' }}

      - name: Stop the schedule (budget reached)
        if: steps.scan.outputs.status == 'budget_stop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable live.yml --repo "$GITHUB_REPOSITORY"

      - name: Persist ledger + last live run to live-data branch
        if: always() && steps.scan.outcome != 'skipped'
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          cd live-data
          git config user.name "smoke-or-vog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "live: ${STATUS:-unknown} $(date -u +%FT%TZ)"
          git push -q origin HEAD:live-data

      - name: Add archive history (stored on the live-data branch)
        if: steps.scan.outputs.status != ''
        run: |
          if [ -d live-data/history ]; then
            mkdir -p site/data/history
            cp -R live-data/history/. site/data/history/
          fi

      - name: Hand the built site to the deploy job
        if: steps.scan.outputs.status != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/
          retention-days: 1

  # Separate job: the Cloudflare token never shares a job with a write-scoped GITHUB_TOKEN.
  deploy:
    needs: scan
    if: needs.scan.outputs.status != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Deploy site to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=smoke-or-vog --branch=main --commit-dirty=true
